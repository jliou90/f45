name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  deploy-sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Compose config sanity
        run: docker compose config > /tmp/compose.rendered.yml

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Production placeholder secret guard check
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python - <<'PY'
          import os
          from pathlib import Path
          os.environ.update({
            "APP_ENV": "prod",
            "ENV": "prod",
            "JWT_SECRET": "dev_change_me",
            "DB_HOST": "localhost",
            "DB_PORT": "5432",
            "DB_NAME": "kutm",
            "DB_USER": "kutm",
            "DB_PASSWORD": "password",
          })
          import sys
          sys.path.insert(0, str(Path("backend").resolve()))
          from app.core.config import validate_runtime_settings
          try:
            validate_runtime_settings()
          except RuntimeError:
            print("placeholder-secret guard: PASS")
            raise SystemExit(0)
          raise SystemExit("placeholder-secret guard failed: expected RuntimeError")
          PY

  backend-gates:
    needs: deploy-sanity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kutm
          POSTGRES_USER: kutm
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kutm -d kutm"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: test
      ENV: test
      JWT_SECRET: ci_jwt_secret_change_me_1234567890123456
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: kutm
      DB_USER: kutm
      DB_PASSWORD: password
      KUTM_IDEMPOTENCY_ENFORCE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: python -m ruff check app tests

      - name: Typecheck strict lane
        run: |
          python -m mypy app/core app/db app/router app/modules/identity app/modules/tenancy app/modules/rbac app/modules/integrations app/modules/ops tools/export_openapi.py tools/check_contract_refs.py tools/check_api_index.py

      - name: Contract/doc drift checks
        run: |
          python tools/check_contract_refs.py
          python tools/check_api_index.py
          python tools/export_openapi.py --out ../frontend/src/api/openapi.json --check

      - name: Typecheck broad regression lane
        run: python tools/mypy_regression_guard.py --max-errors 0 --target app

      - name: Security scan (bandit)
        run: python -m bandit -q -r app

      - name: Security scan (pip-audit)
        run: python -m pip_audit -r requirements.txt

      - name: Migration graph and upgrade checks
        run: |
          python -m alembic heads | tee /tmp/alembic_heads.txt
          python - <<'PY'
          from pathlib import Path
          text = Path("/tmp/alembic_heads.txt").read_text(encoding="utf-8")
          if text.count("(head)") != 1:
              raise SystemExit("Expected exactly one alembic head")
          PY
          python -m alembic upgrade head
          python -m alembic downgrade -1
          python -m alembic upgrade head
          python tools/prove_constraints.py

      - name: Backend tests
        run: |
          python -m alembic upgrade head
          python -m pytest -q tests -rs

      - name: Cross-stack E2E smoke (auth -> tenant -> write)
        run: python -m pytest -q tests/test_e2e_auth_tenant_write_smoke.py

  frontend-gates:
    runs-on: ubuntu-latest
    needs: backend-gates
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify generated API types
        working-directory: frontend
        run: |
          npm run gen:api
          npm run api:types
          git diff --exit-code src/api/openapi.json src/api/types.ts src/gen/openapi-endpoints.ts src/gen/openapi-types.ts

      - name: Frontend checks
        working-directory: frontend
        run: |
          npm run check:api-base
          npm run typecheck
          npm run lint
          npm run test
          npm run build

      - name: Frontend production audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
