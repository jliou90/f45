name: Release Promotion

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (example: v1.2.3)"
        required: true
        type: string

jobs:
  promote-dev:
    runs-on: ubuntu-latest
    environment: dev
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kutm
          POSTGRES_USER: kutm
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kutm -d kutm"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: dev
      ENV: dev
      JWT_SECRET: dev_release_jwt_secret_change_me_1234567890123456
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: kutm
      DB_USER: kutm
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Dev promotion verification
        run: |
          python -m alembic upgrade head
          python -m pytest -q tests/test_install_smoke.py tests/test_patch_e2_fresh_db_proof.py
          python -m alembic downgrade -1
          python -m alembic upgrade head

  promote-staging:
    runs-on: ubuntu-latest
    needs: promote-dev
    environment: staging
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kutm
          POSTGRES_USER: kutm
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kutm -d kutm"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      ENV: test
      JWT_SECRET: staging_release_jwt_secret_change_me_1234567890123
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: kutm
      DB_USER: kutm
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Staging promotion verification
        run: |
          python -m alembic upgrade head
          python -m pytest -q tests/test_health_endpoint.py tests/test_integration_real_module_flows.py
          python -m alembic downgrade -1
          python -m alembic upgrade head

  promote-prod:
    runs-on: ubuntu-latest
    needs: promote-staging
    environment: prod
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kutm
          POSTGRES_USER: kutm
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kutm -d kutm"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: prod
      ENV: prod
      JWT_SECRET: prod_release_jwt_secret_change_me_1234567890123456
      BOOTSTRAP_TOKEN: ""
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: kutm
      DB_USER: kutm
      DB_PASSWORD: password
      TRUSTED_HOSTS: api.example.com
      CORS_ALLOW_ORIGINS: https://app.example.com
      KUTM_IDEMPOTENCY_ENFORCE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Production posture gate
        working-directory: .
        run: |
          cat > backend/.env <<'EOF'
          ENV=prod
          APP_ENV=prod
          JWT_SECRET=prod_release_jwt_secret_change_me_1234567890123456
          BOOTSTRAP_TOKEN=
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_NAME=kutm
          DB_USER=kutm
          DB_PASSWORD=password
          TRUSTED_HOSTS=api.example.com
          CORS_ALLOW_ORIGINS=https://app.example.com
          KUTM_IDEMPOTENCY_ENFORCE=1
          EOF
          pwsh -NoProfile -File scripts/check-prod-security.ps1 -EnvFile backend/.env
      - name: Production promotion verification
        run: |
          python -m alembic upgrade head
          python -m pytest -q tests/test_settings_validation.py tests/test_ops_diag_sanitized.py
          python -m alembic downgrade -1
          python -m alembic upgrade head
